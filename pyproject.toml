[project]
name = "edgevision"
version = "0.1.0"
description = "影像 AI 系統：訓練、部署、推論、監看"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "av>=13.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "httpx>=0.27",
    "apprise>=1.9",
    "tritonclient[http]>=2.50",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "clearml>=1.16",
    "lakefs>=0.8",
    "docker>=7.1",
    "pyyaml>=6.0",
    "PyJWT[crypto]>=2.9",
    "mcp>=1.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
edgevision-login = "edgevision.mcp.login:main"
edgevision-mcp = "edgevision.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]
gpu = ["ultralytics>=8.3", "torch>=2.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edgevision*", "libs*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "integration: 需要運行中的服務(MinIO/PG/Triton/API)",
]
testpaths = ["tests"]
