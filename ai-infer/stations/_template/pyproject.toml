[project]
name = "edgevision-station-template"
version = "0.1.0"
description = "站別範本：偵測到指定類別達 N 個、連續 K 幀 → NG。複製這個目錄開新站。"
requires-python = ">=3.10"
dependencies = ["edgevision-contracts", "edgevision-rules", "edgevision-station-sdk"]

[project.entry-points."edgevision.stations"]
template = "edgevision_station_template:TemplateStation"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"
