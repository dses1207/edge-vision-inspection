[project]
name = "edgevision-cpu-runner"
version = "0.1.0"
description = "Demo 用的 CPU 判讀室：合成畫面 + 場景偵測器取代 GStreamer / Triton，後面的 worker、站別、發布、心跳全部沿用 deepstream_runner。"
requires-python = ">=3.10"
dependencies = [
    "edgevision-contracts",
    "edgevision-postprocess",
    "edgevision-station-sdk",
    "edgevision-deepstream-runner",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[project.scripts]
cpu-runner = "cpu_runner.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cpu_runner"
