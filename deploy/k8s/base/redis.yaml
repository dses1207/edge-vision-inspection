apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 10}
          livenessProbe: {exec: {command: ["redis-cli", "ping"]}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {recurring-job-group.longhorn.io/edgevision-daily: enabled}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
